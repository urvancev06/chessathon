name: ci

on:
  push:
  pull_request:
  # The three-operating-system game matrix is expensive -- GitHub bills macOS minutes at 10x and
  # Windows at 2x -- and the competition only ever runs Linux. It is worth having, but not on
  # every push: run it by hand from the Actions tab, or let the weekly schedule catch a portability
  # regression that nobody was looking for.
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  check:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # Tests that need Stockfish skip themselves; it is not installed here on purpose,
      # so this job also proves the engine and the web app work without it.
      - run: uv run python -m pytest -q

  games:
    name: games
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # Two games that have to finish without a crash, an illegal move or a flag,
      # then build the submission zip and play two more out of it.
      - run: uv run python -m harness.arena --opponent baselines/random --games 2 --base-ms 5000
      - run: uv run python -m harness.package

  portability:
    name: games on ${{ matrix.os }}
    # Only on demand and once a week. This is the job that drained the Actions quota when it ran
    # on every push: the platform is Linux, so macOS and Windows prove portability, not correctness.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run python -m harness.arena --opponent baselines/random --games 2 --base-ms 5000
      - run: uv run python -m harness.package
