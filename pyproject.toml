[project]
name = "mikhail-letal"
version = "0.2.1"
description = "A chess engine in plain Python for AI Chessathon 2026"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alexander Urvancev" }]
keywords = ["chess", "chess-engine", "alpha-beta", "python-chess"]
requires-python = "==3.12.*"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
]

[project.urls]
Repository = "https://github.com/urvancev06/chessathon"

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]  # ruff would reflow the code blocks inside the Markdown design notes

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["agent.py", "harness", "mikhail_letal", "tools", "tests"]
