<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>
html,body{margin:0;background:#dedcd7;color:#1c1b19;font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#1c1b19}a:hover{color:#6f6d68}
</style>
</helmet>
<div style="padding:48px; display:flex; flex-direction:column; gap:72px; width:max-content">
  <div style="display:flex; align-items:center; gap:14px; font-size:15px; color:#1c1b19">
    <svg viewBox="0 0 24 24" width="24" height="24" style="flex:none"><path d="M5 1.5h7v21h-7zM5 8.5h7M5 15.5h7" fill="none" stroke="currentColor" stroke-width="1.5"></path><path d="M11.25 14.75h8.5v8.5h-8.5z" fill="currentColor"></path></svg>
    <span style="font-weight:500">Screens</span><span style="color:#6f6d68">seven screens · light and dark · 1440 and 390 · each frame is the live app</span>
  </div>

  <sc-for list="{{ screens }}" as="s" hint-placeholder-count="7">
    <section data-screen-label="{{ s.label }}" style="display:flex; flex-direction:column; gap:16px">
      <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:#6f6d68; font-weight:500">{{ s.no }} · {{ s.label }}</div>
      <div style="display:flex; gap:40px; align-items:flex-start">
        <div style="display:flex; flex-direction:column; gap:8px">
          <span style="font-size:12px; color:#6f6d68">Light · 1440</span>
          <div style="width:1440px; border:1px solid rgba(28,27,25,0.15); background:#f7f6f3"><dc-import name="App" screen="{{ s.id }}" theme="light" live="{{ false }}" hint-size="1440px,900px"></dc-import></div>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px">
          <span style="font-size:12px; color:#6f6d68">Dark · 1440</span>
          <div style="width:1440px; border:1px solid rgba(28,27,25,0.15); background:#222221"><dc-import name="App" screen="{{ s.id }}" theme="dark" live="{{ false }}" hint-size="1440px,900px"></dc-import></div>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px">
          <span style="font-size:12px; color:#6f6d68">Light · 390</span>
          <div style="width:390px; border:1px solid rgba(28,27,25,0.15); background:#f7f6f3"><dc-import name="App" screen="{{ s.id }}" theme="light" live="{{ false }}" hint-size="390px,900px"></dc-import></div>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px">
          <span style="font-size:12px; color:#6f6d68">Dark · 390</span>
          <div style="width:390px; border:1px solid rgba(28,27,25,0.15); background:#222221"><dc-import name="App" screen="{{ s.id }}" theme="dark" live="{{ false }}" hint-size="390px,900px"></dc-import></div>
        </div>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { screens: [['play', 'Play'], ['new', 'New game'], ['spectate', 'Spectate'], ['overview', 'Overview'], ['docs', 'Docs'], ['weights', 'Weights'], ['openings', 'Openings']].map(([id, label], i) => ({ id, label, no: String(i + 1).padStart(2, '0') })) };
  }
}
</script>
</body>
</html>
